# =============================================================================
#  Full production-like stack:  browser → nginx (Angular) → .NET API → SQL Server
#
#    docker compose up --build        then open http://localhost:8080
#
#  Startup order is enforced with depends_on conditions:
#    sqlserver (healthy) → db-init (runs scripts, exits 0) → api → ui
#
#  Passwords: the defaults below are for LOCAL DEMOS ONLY. Override them in a .env file
#  (see .env.example). In real environments use a secret store (Key Vault, AWS Secrets
#  Manager, Kubernetes Secrets) and Managed Identity rather than SQL passwords.
# =============================================================================
name: northwind-catalog

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Northwind_Sa_Passw0rd!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"            # so you can connect with Azure Data Studio / SSMS
    volumes:
      - sqldata:/var/opt/mssql # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot job: deploys schema + seed data + a least-privilege login, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./SQLServerDb:/db:ro
    environment:
      SQL_SERVER: sqlserver,1433
      SA_PASSWORD: ${SA_PASSWORD:-Northwind_Sa_Passw0rd!}
      APP_LOGIN: catalog_api
      APP_PASSWORD: ${APP_PASSWORD:-Catalog_Api_Passw0rd!}
    entrypoint: ["/bin/bash", "/db/deploy.sh"]
    restart: "no"

  api:
    build: ./CSharpAPI
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Configuration via env vars: "__" maps to ":" (ConnectionStrings:Catalog)
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=NorthwindCatalog;User Id=catalog_api;Password=${APP_PASSWORD:-Catalog_Api_Passw0rd!};TrustServerCertificate=True;Encrypt=True"
      Database__Provider: SqlServer
      # Trust X-Forwarded-* from nginx, so rate limiting sees the real client IP
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "5080:8080"            # optional: direct API access (health checks, curl)
    restart: unless-stopped

  ui:
    build: ./AngularUI
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqldata:
