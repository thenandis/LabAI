# =============================================================================
#  nginx for the Angular SPA (production)
#   - serves the static build with aggressive caching for hashed files
#   - SPA fallback: unknown paths → index.html, so Angular's router handles them
#   - reverse-proxies /api → the .NET API container (same origin, so no CORS)
# =============================================================================
server {
    listen 8080;                       # unprivileged image: non-root, so port > 1024
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                 # hide the nginx version

    # ---- Compression (Brotli needs an extra module; gzip is built in) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Hashed build output (main-E6W4BYBA.js): cache for 1 year, immutable ----
    # The Angular CLI puts a content hash in every file name, so a new deploy produces
    # NEW names. Browsers can cache forever and still always get fresh code.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    # ---- index.html must NEVER be cached: it points at the current hashed bundles ----
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;  # real client IP for rate limiting
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;   # a little above the API's 30s request timeout
    }

    # ---- SPA fallback: /products/5/edit → index.html, then Angular routes it ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
