# Security headers, included in EVERY location block.
# nginx gotcha: if a location defines ANY add_header, it inherits NONE from the
# server block. A shared include avoids silently losing headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: only our own scripts, styles and API calls. Blocks injected third-party scripts (XSS mitigation).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
