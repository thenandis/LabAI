<!-- Global progress bar: visible while any HTTP request is in flight (LoadingService) -->
<div class="progress" [class.is-active]="loading.isLoading()" role="progressbar" aria-label="Loading" [attr.aria-hidden]="!loading.isLoading()"></div>

<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <div class="app-header__inner">
    <a routerLink="/" class="brand" aria-label="Northwind Catalog home">
      <span class="brand__mark" aria-hidden="true">N</span>
      <span class="brand__name">Northwind Catalog</span>
    </a>
    <nav class="app-nav" aria-label="Main">
      <a routerLink="/products" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }">Products</a>
    </nav>
  </div>
</header>

<main id="main" class="app-main">
  <router-outlet />
</main>

<app-toast-container />
